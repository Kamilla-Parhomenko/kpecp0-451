<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    
  <include id="header" src="../../components/header/header.html"></include>

    <div class="content h-screen w-full p-20 bg-linear-to-b from-green-200 to-green-300 mt-[-60px]">
        <div class="flex w-full justify-around p-10">
            <div class="w-1/3 space-y-2">
                <p class="text-xl text-green-700 font-medium text-shadow-xs">First name</p>
                <input type="text" class="border border-green-200 p-1 rounded-md w-full bg-linear-to-b from-green-300 to-green-200 outline-none w-full">
                <p class="text-xl text-green-700 font-medium text-shadow-xs">Last name</p>
                <input type="text" class="border border-green-200 p-1 rounded-md w-full bg-linear-to-b from-green-300 to-green-200 outline-none w-full">
                <p class="text-xl text-green-700 font-medium text-shadow-xs">Country</p>
                <input type="text" class="border border-green-200 p-1 rounded-md w-full bg-linear-to-b from-green-300 to-green-200 outline-none w-full">
                <p class="text-xl text-green-700 font-medium text-shadow-xs">City</p>
                <input type="text" class="border border-green-200 p-1 rounded-md w-full bg-linear-to-b from-green-300 to-green-200 outline-none w-full">
                <p class="text-xl text-green-700 font-medium text-shadow-xs">Address</p>
                <input type="text" class="border border-green-200 p-1 rounded-md w-full bg-linear-to-b from-green-300 to-green-200 outline-none w-full">
                <p class="text-xl text-green-700 font-medium text-shadow-xs">Zip</p>
                <input type="text" class="border border-green-200 p-1 rounded-md w-full bg-linear-to-b from-green-300 to-green-200 outline-none w-full">
                <p class="text-xl text-green-700 font-medium text-shadow-xs">Tel</p>
                <input type="tel" class="border border-green-200 p-1 rounded-md w-full bg-linear-to-b from-green-300 to-green-200 outline-none w-full">
                <p class="text-xl text-green-700 font-medium text-shadow-xs">Email</p>
                <input type="email" class="border border-green-200 p-1 rounded-md w-full bg-linear-to-b from-green-300 to-green-200 outline-none w-full">
                <input type="checkbox">
                <label class="text-orange-500">Agree to TAC</label>
            </div>
            <div class="space-y-3">
                <p class="text-xl text-green-700 font-medium text-shadow-xs">Card number</p>
                <input type="password" class="border border-green-200 p-1 rounded-md w-full bg-linear-to-b from-green-300 to-green-200 outline-none w-full">
                <p class="text-green-700 font-medium text-shadow-xs">Expiration Date</p>
                <input type="date" class="border border-green-200 p-1 rounded-md w-full bg-linear-to-b from-green-300 to-green-200 outline-none w-full">
                <table class="w-full text-2xl text-orange-500 text-shadow-lg">
                        <tr class="border-b border-green-100">
                            <td>Subtotal</td>
                            <td class="text-right p-3">189.9699999999999997$</td>
                        </tr>
                        <tr class="border-b border-green-100">
                            <td>Shipping</td>
                            <td class="text-right p-3">free</td>
                        </tr>
                        <tr>
                            <td>Total</td>
                            <td class="text-right p-3">189.9699999999999997$</td>
                        </tr>
                    </table>
                    <button type="button"  class="px-3 py-1 bg-linear-to-b from-orange-400 to-orange-600 text-white font-medium rounded-md hover:bg-orange-300 cursor-pointer shadow-lg outline-2 outline-orange-500">Place order</button>
            </div>
        </div>
    </div>

    
    <include id="footer" src="../../components/footer/footer.html"></include>


    <script type="module" src="../../utils/include.js"></script>
</body>
</html>
